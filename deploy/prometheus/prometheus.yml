# Prometheus scrape config for the PMAIP platform.
# /metrics is unauthenticated: expose it only on the internal scrape network
# (block it at the ingress for public traffic).
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: pmaip-platform

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: pmaip-api
    metrics_path: /metrics
    static_configs:
      - targets: ["pmaip-api:8000"]
        labels:
          component: api
  # The worker records deployment/rollback/canary execution metrics in its own
  # process: run it as `python -m app.platform.worker --metrics-port 9100`.
  - job_name: pmaip-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["pmaip-worker:9100"]
        labels:
          component: worker
