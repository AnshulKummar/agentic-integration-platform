# Standalone pytest config for the demo backend. Using this file (-c) makes
# tests/demo the rootdir, so the platform's tests/conftest.py (which imports the
# database layer) is never loaded.
#   .venv-demo/Scripts/python.exe -m pytest -c tests/demo/pytest.ini tests/demo
[pytest]
testpaths = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
timeout = 120
addopts = -p no:cacheprovider -q
filterwarnings =
    error::pytest.PytestUnraisableExceptionWarning
