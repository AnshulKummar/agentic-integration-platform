# Standalone pytest config for the platform. Using -c makes tests/platform the
# rootdir, so the legacy tests/conftest.py (which needs the old stack) never loads.
#   .venv-demo/Scripts/python.exe -m pytest -c tests/platform/pytest.ini tests/platform
# Run against PostgreSQL by setting PLATFORM_TEST_DATABASE_URL=postgresql+asyncpg://...
[pytest]
testpaths = .
pythonpath = ../..
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
timeout = 120
addopts = -p no:cacheprovider -q --import-mode=importlib
markers =
    docker: needs a Docker daemon (run in CI)
    postgres: needs PostgreSQL (PLATFORM_TEST_DATABASE_URL)
    live_llm: calls the real Anthropic API (needs ANTHROPIC_API_KEY; opt-in)
    slow: slower end-to-end tests
filterwarnings =
    error::pytest.PytestUnraisableExceptionWarning
